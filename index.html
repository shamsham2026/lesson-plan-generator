      }

    // 切換分頁標籤
    function filterTab(tabKey) {
      activeTab = tabKey;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        if (btn.dataset.tab === tabKey) {
          btn.className = "tab-btn px-2.5 py-1 text-xs rounded font-semibold bg-white shadow-sm border border-slate-200 text-blue-600";
        } else {
          btn.className = "tab-btn px-2.5 py-1 text-xs rounded font-medium text-slate-600 hover:bg-slate-200/50";
        }
      });
      renderActiveView();
    }

    // 切換解答顯示/隱藏
    function toggleAnswers(show) {
      const container = document.getElementById("contentDisplay");
      if (show) {
        container.classList.remove("hide-answers");
      } else {
        container.classList.add("hide-answers");
      }
    }

    // 複製指定區塊指令
    function copySnippet(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const text = el.innerText;
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("已成功複製遊戲生成指令！");
      } catch (err) {
        showToast("複製失敗，請手動反白複製");
      }
      document.body.removeChild(textarea);
    }

    // 複製文字至剪貼簿（符合安全規範，不使用 alert）
    function copyToClipboard() {
      const text = document.getElementById("contentDisplay").innerText;
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("已成功將全文複製至剪貼簿！");
      } catch (err) {
        showToast("複製失敗，請手動選取");
      }
      document.body.removeChild(textarea);
    }

    // 漂浮提示條
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").textContent = msg;
      toast.classList.remove("opacity-0", "pointer-events-none");
      setTimeout(() => {
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 2500);
