  <script>
    const SYLLABUS = {
      P1: ["認識1至20", "2至10的分解和合成", "基本加法", "基本減法", "個位和十位", "認識21至100", "加法(一)", "減法", "香港的硬幣", "認識平面圖形", "厘米"],
      P2: ["三位數", "加法(一)", "加法(二)", "減法", "角和直角", "銳角和鈍角", "米的認識", "2、5和10的乘法", "3和6的乘法", "報時", "四位數", "除法", "正方形和長方形"],
      P3: ["五位數", "乘法(一)", "除法(一)", "除法(二)", "平行四邊形和梯形", "三角形", "分數的認識(一)", "同分母分數加法和減法", "升和毫升", "棒形圖"],
      P4: ["乘法(一)", "除法(一)", "整除性", "倍數", "因數", "公因數和最大公因數", "公倍數和最小公倍數", "周界的認識", "正方形的周界", "長方形的周界", "同分母分數加法", "同分母分數減法", "長方形和正方形的面積", "小數的認識"],
      P5: ["異分母分數加法", "異分母分數減法", "平行四邊形的面積", "三角形的面積", "梯形的面積", "多邊形的面積", "分數乘法", "代數符號", "分數除法", "體積的量度", "簡易方程(一)", "簡易方程(二)"],
      P6: ["小數除法", "百分數的認識", "百分數的應用", "圓周(一)", "圓周(二)", "圓面積(一)", "圓面積(二)", "圓周與圓面積", "速率", "行程圖", "簡易方程(一)", "簡易方程(二)"]
    };

    const state = {
      grade: "P6",
      duration: 30,
      activeTab: "all",
      topic: "圓周與圓面積",
      showAnswers: true,
      generated: null,
      toastTimer: null
    };

    const els = {
      topicDropdown: document.getElementById("topicDropdown"),
      customTopicInput: document.getElementById("customTopicInput"),
      contentDisplay: document.getElementById("contentDisplay"),
      loadingIndicator: document.getElementById("loadingIndicator"),
      currentTopicLabel: document.getElementById("currentTopicLabel"),
      printHeaderTitle: document.getElementById("printHeaderTitle"),
      toast: document.getElementById("toast"),
      toastMsg: document.getElementById("toastMsg"),
      generateButton: document.getElementById("generateBtn")
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatText(text) {
      return escapeHtml(text)
        .replace(/\n/g, "<br>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    }

    function populateTopics(grade) {
      const topics = SYLLABUS[grade] || [];
      els.topicDropdown.replaceChildren();

      topics.forEach((topic) => {
        const option = document.createElement("option");
        option.value = topic;
        option.textContent = topic;
        els.topicDropdown.appendChild(option);
      });

      const preferred = grade === "P6" ? "圓周與圓面積" : topics[0];
      state.topic = preferred;
      els.topicDropdown.value = preferred;
      els.customTopicInput.value = preferred;
    }

    function updateSelectedButtons() {
      document.querySelectorAll(".grade-btn").forEach((button) => {
        const selected = button.dataset.grade === state.grade;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      document.querySelectorAll(".dur-btn").forEach((button) => {
        const selected = Number(button.dataset.duration) === state.duration;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      document.querySelectorAll(".tab-btn").forEach((button) => {
        const selected = button.dataset.tab === state.activeTab;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-selected", String(selected));
      });
    }

    function updateMeta() {
      els.currentTopicLabel.textContent = `${state.grade} 數學科 ・ ${state.topic} ・ ${state.duration}分鐘教案`;
      els.printHeaderTitle.textContent = `年級：${state.grade} ｜ 課題：${state.topic} ｜ 課時：${state.duration}分鐘`;
    }

    function getCircleModules(duration) {
      const teachingPlan = duration === 30
        ? `
          <h2>二、詳細教學計劃（30 分鐘緊湊單堂課）</h2>

          <ol>
            <li>區分圓周的長度概念與圓面積的平面概念。</li>
            <li>掌握半圓周界必須「弧長加直徑」的規則。</li>
            <li>能由圓周逆向求出半徑，再計算圓面積。</li>
          </ol>
          ${lessonTable([
            ["00–03 分鐘", "生活問題速問", "圓形時鐘外圍貼彩帶與鐘面塗色，分別量甚麼？", "辨別圓周與面積。"],
            ["03–11 分鐘", "公式算理提煉", "圓周 C = πd = 2πr；面積 A = πr²。", "比較直徑、半徑與單位。"],
            ["11–19 分鐘", "描邊法破解半圓周界", "手指沿半圓外圍走一圈，還缺哪條邊？", "指出弧長外必須加上直徑。"],
            ["19–26 分鐘", "分層快練", "已知 C = 62.8cm，如何求面積？", "完成 C → r → A 逆向路徑。"],

        : `

            ["22–34 分鐘", "描邊與逆向解題", "半圓的封閉邊界包括甚麼？", "畫出 C → r → A 路徑。"],
            ["34–44 分鐘", "小組互動遊戲", "每條外圍邊界都有被算到嗎？", "進行公式快拍手及周界巡邏。"],
            ["44–54 分鐘", "分層工作紙", "可用哪兩個圖形相減？", "完成 A、B、C 級題目。"],
            ["54–60 分鐘", "展示與反思", "今天最容易跌入的陷阱是甚麼？", "分享策略及完成反思。"]
          ])}
          <h3>板書設計</h3>
          <div class="reflection-card">課題：圓周與圓面積
π = 圓周 ÷ 直徑
C = πd = 2πr
A = πr²

★ 半圓周界 = (πd ÷ 2) + d

      return {
        mod1: `
          <section>
            <h2>一、課題難點診斷與認知障礙分析</h2>
            ${diagnosticTable([
              ["公式混淆", "計算圓周時誤用半徑，或計算面積時直接把直徑平方。", "比較「一維長度」與「二維面積」，配合公式卡分類。"],
              ["半圓周界漏加直徑", "只計算半圓弧長，遺漏直徑底邊。", "運用手指描邊法，強調封閉圖形的完整邊界。"],
              ["逆向運算卡關", "已知圓周時，未能先求半徑再求面積。", "以 C → r → A 箭咀圖建立兩步運算支架。"]
            ])}
          </section>`,
        mod2: `<section>${teachingPlan}</section>`,
        mod3: `
          <section>
            <h2>三、鞏固遊戲設計與生成指令</h2>
            <h3>遊戲 1：公式快拍手</h3>
            <p>雙人對戰，教師展示條件卡，例如「半徑 3cm，求圓周」，學生快速拍下正確公式卡。可用來檢核圓周公式與面積公式的辨別能力。</p>
            <h3>遊戲 2：周界巡邏員</h3>
            <p>投影半圓、扇形或跑道圖形，學生以彩筆沿完整外圍描邊，再寫出每段邊界對應的運算式。</p>
            ${promptBox("prompt-circle", `請為香港小學六年級數學課題「圓周與圓面積」設計 5 題互動選擇題：

        mod4: `

            ${question("2. 一個圓形杯墊的直徑是 14cm。求圓周及面積。（π 取 22/7）", "半徑 = 14 ÷ 2 = 7cm；圓周 = 44cm；面積 = 154cm²。")}
            <h3>B 中階進階題</h3>
            ${question("3. 一個半徑為 7cm 的半圓形紙片，求它的周界。（π 取 22/7）", "直徑 = 14cm；半圓弧長 = 22cm；周界 = 22 + 14 = 36cm。")}
            ${question("4. 一條長 88cm 的鐵絲剛好圍成一個圓形。求圓面積。（π 取 22/7）", "直徑 = 88 ÷ (22/7) = 28cm；半徑 = 14cm；面積 = 616cm²。")}
            ${question("5. 小聰以 3.14 × (10 ÷ 2) × (10 ÷ 2) 計算直徑 10cm 的半圓面積。找出錯誤。", "該算式計算的是整圓面積 78.5cm²，半圓面積應為 78.5 ÷ 2 = 39.25cm²。")}
            <h3>C 高階思考題</h3>
            ${question("6. 邊長 20cm 的正方形內有一個最大內切圓。求四角陰影面積。", "正方形面積 = 400cm²；圓面積 = 3.14 × 10 × 10 = 314cm²；陰影面積 = 86cm²。")}
          </section>`,
        mod5: `
          <section>
            <h2>五、課後鞏固反思筆記卡</h2>
            <div class="reflection-card">【六年級數學反思筆記：圓周與圓面積】

1. 核心公式
・圓周：C = πd 或 C = 2πr
・面積：A = πr²

2. 易錯檢查

________________________________________________</div>
          </section>`
      };
    }

    function lessonTable(rows) {
      return `<div class="table-scroll"><table><thead><tr><th>節奏與時間</th><th>教學環節</th><th>教師引導</th><th>學生學習活動</th></tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

    function diagnosticTable(rows) {
      return `<div class="table-scroll"><table><thead><tr><th>難點維度</th><th>常見迷思概念／操作障礙</th><th>成因剖析與對策</th></tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

    function question(questionText, answerText) {
      return `<div class="mb-4"><p><strong>${questionText}</strong></p><div class="solution-box"><strong>【解答步驟】</strong><br>${answerText}</div><div class="student-space" aria-label="學生作答空間"></div></div>`;
    }

    function promptBox(id, text) {
      return `<div class="prompt-box"><button type="button" class="prompt-copy control-button rounded bg-blue-600 px-2 py-1 text-[11px] font-semibold text-white hover:bg-blue-500" data-copy-target="${id}">複製指令</button><div id="${id}">${formatText(text)}</div></div>`;
    }

    function buildUniversalPackage(grade, topic, duration) {
      const durationLabel = duration === 30 ? "緊湊單堂課" : "深入連堂課";
      const topicSafe = escapeHtml(topic);

      const paceRows = duration === 30
        ? [
            ["00–03 分鐘", "生活問題引入", `日常生活中，甚麼時候會遇到「${topicSafe}」？`, "連結生活經驗，聚焦課題。"],
            ["03–12 分鐘", "概念探究", "第一步應先確定甚麼條件？", "觀察圖解並記錄規則。"],
            ["12–20 分鐘", "錯例診斷", "這個步驟哪裡出錯？", "小組找出陷阱並修正。"],
            ["20–26 分鐘", "隨堂快練", "如何驗算答案是否合理？", "完成基礎及進階題。"],
            ["26–30 分鐘", "總結評估", "今天最重要的一句話是甚麼？", "口答及標記易錯點。"]
          ]
        : [
            ["00–08 分鐘", "情境與舊知回顧", `「${topicSafe}」與之前學過的概念有何關係？`, "提取先備知識。"],
            ["08–22 分鐘", "動手操作與推導", "改變數值後，規則仍成立嗎？", "分組操作、歸納法則。"],
            ["22–34 分鐘", "錯例辨析", "哪種方法較簡潔？", "診斷錯因並比較解法。"],
            ["34–44 分鐘", "遊戲鞏固", "注意題目的限制條件與單位。", "參與互動搶答。"],
            ["44–54 分鐘", "分層工作紙", "遇到難題時可先畫甚麼？", "獨立練習及接受回饋。"],
            ["54–60 分鐘", "反思整理", "今天克服了哪個盲點？", "完成反思筆記。"]
          ];

      return {
        mod1: `
          <section>
            <h2>一、課題難點診斷與認知障礙分析</h2>
            ${diagnosticTable([
              ["核心概念模糊", `對「${topicSafe}」的特徵或運算法則理解不透，容易死套公式。`, "以教具、圖像及具體例子建立心智模型。"],
              ["步驟與符號轉換", "運算步驟較多時容易跳步、漏寫單位或忘記化簡。", "提供口訣及結構化解題框架。"],
              ["情境建模與逆向推論", "文字題中未能分辨已知與未知條件。", "強化畫圖、列關係式及驗算策略。"]
            ])}
          </section>`,
        mod2: `
          <section>
            <h2>二、詳細教學計劃（${duration} 分鐘 ${durationLabel}）</h2>
            <h3>教學目標</h3>
            <ol>
              <li>理解「${topicSafe}」的核心概念與運算邏輯。</li>
              <li>掌握標準解題步驟，能準確處理基礎情境題。</li>
              <li>建立自查與驗算習慣，減少常見錯誤。</li>
            </ol>
            ${lessonTable(paceRows)}
            <h3>板書設計</h3>
            <div class="reflection-card">課題：${topicSafe}
1. 核心概念／公式
2. 解題三部曲：
   ① 審題抓條件
   ② 列式重算理
   ③ 驗算防陷阱

★ 易錯提示：留意單位、步驟及逆向推算。</div>
          </section>`,
        mod3: `
          <section>
            <h2>三、鞏固遊戲設計與生成指令</h2>
            <h3>基礎遊戲：概念配對卡</h3>
            <p>學生配對「條件卡、圖像卡、公式卡與答案卡」，辨別「${topicSafe}」所需的關鍵資訊。</p>
            <h3>進階遊戲：除錯小法官</h3>
            <p>教師展示一個包含錯誤步驟的解法，小組找出錯誤位置、說明原因，並提出修正方法。</p>
            ${promptBox("prompt-universal", `請為「${grade} 數學科－${topic}」設計 5 道 Wordwall 互動選擇題：
1. 概念題 2 題
2. 計算應用題 2 題
3. 改錯陷阱題 1 題
請使用香港小學常用繁體中文數學術語，提供四個選項、正確答案及簡短解析。`)}
          </section>`,
        mod4: `
          <section>
            <h2>四、分層學習工作紙</h2>
            <h3>A 初階基本題</h3>
            ${question(`1. 請簡述「${topicSafe}」的核心定義與主要計算步驟。`, "依課本標準定義，寫出關鍵公式、性質或操作流程。")}
            ${question(`2. 選擇一組標準數值，計算「${topicSafe}」的結果。`, "列出完整橫式，並按步驟計算及標示單位。")}
            <h3>B 中階進階題</h3>
            ${question(`3. 設計一道與「${topicSafe}」有關的生活情境題，並列式求解。`, "先列出已知及未知條件，再完成計算與驗算。")}
            ${question(`4. 已知結果，反求「${topicSafe}」的原始條件。`, "運用逆向思維、關係式或簡易方程求解。")}
            ${question("5. 指出一個常見解題錯誤，並說明正確做法。", "圈出錯誤步驟，補回遺漏條件或重新列式。")}
            <h3>C 高階思考題</h3>
            ${question(`6. 設計一題結合多個條件的「${topicSafe}」應用題，並嘗試使用兩種方法解答。`, "可使用圖解、轉化法、割補法或方程法，比較不同策略。")}
          </section>`,
        mod5: `
          <section>
            <h2>五、課後鞏固反思筆記卡</h2>
            <div class="reflection-card">【${grade} 數學反思筆記：${topicSafe}】

1. 今日核心口訣：
________________________________________________

2. 我的易錯警示燈：
________________________________________________

3. 我已掌握的解題步驟：
________________________________________________

4. 我想挑戰的延伸題：
________________________________________________</div>
          </section>`
      };
    }

    function getGeneratedPackage() {
      if (state.topic === "圓周與圓面積") {
        return getCircleModules(state.duration);
      }
      return buildUniversalPackage(state.grade, state.topic, state.duration);
    }

    function renderActiveView() {
      if (!state.generated) return;

      const moduleKeys = state.activeTab === "all"
        ? ["mod1", "mod2", "mod3", "mod4", "mod5"]
        : [state.activeTab];

      els.contentDisplay.innerHTML = moduleKeys
        .map((key) => state.generated[key] || "")
        .join('<div class="border-t border-slate-200"></div>');

      els.contentDisplay.classList.toggle("hide-answers", !state.showAnswers);
      updateSelectedButtons();
    }

    function setLoading(isLoading) {
      els.loadingIndicator.classList.toggle("hidden", !isLoading);
      els.contentDisplay.classList.toggle("hidden", isLoading);
      els.generateButton.disabled = isLoading;
      els.generateButton.classList.toggle("opacity-70", isLoading);
      els.generateButton.classList.toggle("cursor-wait", isLoading);
    }

    function generateResources({ showNotice = true } = {}) {
      const enteredTopic = els.customTopicInput.value.trim();
      state.topic = enteredTopic || els.topicDropdown.value || "數學綜合題";
      els.customTopicInput.value = state.topic;
      updateMeta();
      setLoading(true);

      window.setTimeout(() => {
        state.generated = getGeneratedPackage();
        setLoading(false);
        renderActiveView();
        if (showNotice) showToast(`已更新為 ${state.duration} 分鐘教學資源。`);
      }, 180);
    }

    function showToast(message) {
      els.toastMsg.textContent = message;
      els.toast.classList.add("toast-show");
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => {
        els.toast.classList.remove("toast-show");
      }, 2600);
    }

    async function copyText(text, successMessage) {
      if (!text.trim()) {
        showToast("目前沒有可複製的內容。");
        return;
      }

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("Copy failed");
        }
        showToast(successMessage);
      } catch {
        showToast("複製失敗，請手動選取內容。");
      }
    }

    document.querySelectorAll(".grade-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.grade = button.dataset.grade;
        populateTopics(state.grade);
        updateSelectedButtons();
        generateResources();
      });
    });

    document.querySelectorAll(".dur-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.duration = Number(button.dataset.duration);
        updateSelectedButtons();
        generateResources();
      });
    });

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.activeTab = button.dataset.tab;
        renderActiveView();
      });
    });

    els.topicDropdown.addEventListener("change", () => {
      els.customTopicInput.value = els.topicDropdown.value;
    });

    els.customTopicInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        generateResources();
      }
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      generateResources();
    });

    document.getElementById("toggleAnswerSwitch").addEventListener("change", (event) => {
      state.showAnswers = event.target.checked;
      els.contentDisplay.classList.toggle("hide-answers", !state.showAnswers);
      showToast(state.showAnswers ? "已顯示解答與步驟。" : "已切換為學生空白工作紙。");
    });

    document.getElementById("printButton").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("copyAllButton").addEventListener("click", () => {
      copyText(els.contentDisplay.innerText, "已複製目前顯示的教學資源。");
    });

    els.contentDisplay.addEventListener("click", (event) => {
      const copyButton = event.target.closest("[data-copy-target]");
      if (!copyButton) return;
      const target = document.getElementById(copyButton.dataset.copyTarget);
      if (target) copyText(target.innerText, "已複製遊戲生成指令。");
    });

    window.addEventListener("DOMContentLoaded", () => {
      populateTopics(state.grade);
      updateSelectedButtons();
      updateMeta();
      generateResources({ showNotice: false });
      lucide.createIcons();
    });
  </script>
 </body>
</html>
