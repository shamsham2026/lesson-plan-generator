  <style>
    :root {
      --ink: #13263a;
      --muted: #5b6b7c;
      --line: #d5e0ea;
      --teal: #0f766e;
      --teal-deep: #0b5f59;
      --teal-soft: #e6f4f2;
      --amber: #c2410c;
      --paper: #fffdf9;
      --canvas: #e8eef4;
      --shadow: 0 10px 28px rgba(19, 38, 58, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Bricolage Grotesque", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    button, input, select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(15, 118, 110, .28);
      outline-offset: 2px;
    }

    .resource-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(ellipse 70% 45% at 100% -10%, rgba(15, 118, 110, .16), transparent 55%),
        radial-gradient(ellipse 50% 35% at 0% 100%, rgba(194, 65, 12, .08), transparent 50%),
        linear-gradient(180deg, #edf3f7 0%, #e4ebf2 100%);
    }

    .brand-mark {
      background: linear-gradient(145deg, #0f766e, #134e4a);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 14px rgba(15, 118, 110, .28);
    }

    .brand-title {
      font-family: "Noto Serif TC", "Bricolage Grotesque", serif;
      font-size: 1.05rem;
      letter-spacing: .01em;
    }

    .panel-surface {
      background:
        linear-gradient(180deg, rgba(255,253,249,.98), rgba(255,255,255,.96));
      box-shadow: var(--shadow);
    }

    .control-button {
      transition: transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .control-button:hover { transform: translateY(-1px); }
    .control-button:active { transform: translateY(0); }

    .selection-button.is-active,
    .tab-button.is-active {
      color: var(--teal-deep);
      background: var(--teal-soft);
      border-color: var(--teal);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(15, 118, 110, .12);
    }

    .tab-button.is-active {
      background: #ffffff;
    }

    .generate-btn {
      color: #fff;
      background: linear-gradient(135deg, #0f766e, #0b5f59);
      border: 1px solid #0b5f59;
    }

    .generate-btn:hover {
      background: linear-gradient(135deg, #0e6b64, #094e49);
    }

    .generate-btn:disabled {
      opacity: .7;
      cursor: wait;
      transform: none;
    }

    .ready-chip {
      color: var(--teal-deep);
      background: var(--teal-soft);
      border: 1px solid rgba(15, 118, 110, .22);
    }

    .sheet-box {
      min-height: 650px;
      background:
        linear-gradient(180deg, #fffefb 0%, #ffffff 40%),
        #ffffff;
    }

    .md-zone {
      color: #334155;
      font-size: .925rem;
      line-height: 1.72;
    }

    .md-zone section {
      animation: riseIn .35s ease both;
    }

    .md-zone section + section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px dashed #d5e0ea;
    }

    .md-zone h2 {
      font-family: "Noto Serif TC", "Noto Sans TC", serif;
      font-size: 1.22rem;
      font-weight: 700;
      color: #134e4a;
      border-left: 4px solid var(--teal);
      padding-left: .75rem;
      margin: 0 0 1rem;
    }

    .md-zone h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #0f766e;
      margin: 1.35rem 0 .5rem;
    }

    .md-zone p { margin: .5rem 0; }

    .md-zone ul,
    .md-zone ol {
      padding-left: 1.4rem;
      margin: .5rem 0;
    }

    .md-zone li { margin: .28rem 0; }

    .md-zone table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: .84rem;
    }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: .85rem;
      background: #fff;
    }

    .md-zone th,
    .md-zone td {
      border-bottom: 1px solid var(--line);
      padding: .75rem .85rem;
      vertical-align: top;
      text-align: left;
    }

    .md-zone th {
      color: #134e4a;
      background: linear-gradient(180deg, #f3faf9, #eef7f5);
      font-weight: 700;
    }

    .md-zone tr:last-child td { border-bottom: 0; }

    .module-divider {
      height: 1px;
      margin: 1.5rem 0;
      background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
    }

    .question-block {
      margin-bottom: 1rem;
      padding: .9rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: .85rem;
      background: #fcfdff;
    }

    .solution-box {
      margin-top: .55rem;
      padding: .75rem .85rem;
      color: #475569;
      background: #f4faf9;
      border: 1px solid #cfe7e3;
      border-radius: .6rem;
      font-size: .82rem;
    }

    .student-space {
      display: none;
      height: 84px;
      margin-top: .6rem;
      border: 1px dashed #94a3b8;
      border-radius: .6rem;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 25px,
        rgba(203, 213, 225, .65) 26px
      );
    }

    .hide-answers .solution-box { display: none !important; }
    .hide-answers .student-space { display: block; }

    .prompt-box {
      position: relative;
      margin-top: .8rem;
      padding: 1rem;
      padding-right: 7rem;
      overflow: auto;
      color: #e2e8f0;
      background:
        radial-gradient(circle at 100% 0%, rgba(15, 118, 110, .35), transparent 40%),
        #13263a;
      border-radius: .85rem;
      font-family: "Noto Sans TC", "Bricolage Grotesque", sans-serif;
      font-size: .78rem;
      line-height: 1.65;
    }

    .prompt-copy {
      position: absolute;
      top: .65rem;
      right: .65rem;
    }

    .reflection-card {
      padding: 1rem 1.1rem;
      overflow: auto;
      color: #334155;
      background:
        linear-gradient(180deg, #fffef8, #f8fafc);
      border: 1px solid #d6dee8;
      border-left: 4px solid #c2410c;
      border-radius: .75rem;
      white-space: pre-wrap;
      font-size: .86rem;
      line-height: 1.75;
    }

    .tip-banner {
      font-size: .72rem;
      line-height: 1.5;
      color: var(--muted);
      background: #f3f8f7;
      border: 1px dashed #b7d4cf;
      border-radius: .7rem;
      padding: .65rem .75rem;
    }

    .toast-show {
      opacity: 1 !important;
      transform: translateY(0) !important;
      pointer-events: auto !important;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(15, 118, 110, .25); }
      50% { box-shadow: 0 0 0 8px rgba(15, 118, 110, 0); }
    }

    .loading-ring {
      animation: softPulse 1.4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .md-zone section,
      .control-button,
      .loading-ring { animation: none !important; transition: none !important; }
    }

    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: #ffffff !important; }
      .resource-shell { min-height: auto !important; background: #ffffff !important; }
      .sheet-box {
        min-height: auto !important;
        box-shadow: none !important;
        border: 1px solid #94a3b8 !important;
      }
      #outputWrapper {
        overflow: visible !important;
        padding: 1.25rem !important;
      }
      .solution-box,
      .question-block { break-inside: avoid; }
      .table-scroll { overflow: visible !important; }
      .md-zone table { min-width: 0 !important; }
      .md-zone section + section {
        border-top: 1px solid #cbd5e1;
      }
    }
  </style>

   <header data-template-id="top-header" class="canva-header sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur-md no-print">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">

            <h3>教學目標</h3>
            <ol>
              <li>理解「${topicSafe}」的核心概念與運算邏輯。</li>
              <li>掌握標準解題步驟，能準確處理基礎情境題。</li>
              <li>建立自查與驗算習慣，減少常見錯誤。</li>
            </ol>
            <h3>課堂關鍵提醒</h3>
            <ul>
              <li>${escapeHtml(hints[0])}</li>
              <li>${escapeHtml(hints[1])}</li>
              <li>${escapeHtml(hints[2])}</li>
            </ul>
            ${lessonTable(paceRows)}
            <h3>板書設計</h3>
            <div class="reflection-card">課題：${topicSafe}
1. 核心概念／公式
2. 解題三部曲：
   ① 審題抓條件
   ② 列式重算理
   ③ 驗算防陷阱

★ 今日提醒：
${hintLine}</div>
          </section>`,
        mod3: `
          <section>
            <h2>三、鞏固遊戲設計與生成指令</h2>
            <h3>基礎遊戲：概念配對卡</h3>
            <p>學生配對「條件卡、圖像卡、公式卡與答案卡」，辨別「${topicSafe}」所需的關鍵資訊。</p>
            <h3>進階遊戲：除錯小法官</h3>
            <p>教師展示一個包含錯誤步驟的解法，小組找出錯誤位置、說明原因，並提出修正方法。</p>
            ${promptBox("prompt-universal", `請為「${grade} 數學科－${topic}」設計 5 道 Wordwall 互動選擇題：
1. 概念題 2 題
2. 計算應用題 2 題
3. 改錯陷阱題 1 題
請使用香港小學常用繁體中文數學術語，提供四個選項、正確答案及簡短解析。重點覆蓋：${hints.join("、")}。`)}
          </section>`,
        mod4: `
          <section>
            <h2>四、分層學習工作紙</h2>
            <p>A 級確認定義與基本運算；B 級加入情境與逆向；C 級要求多策略比較。</p>
            <h3>A 初階基本題</h3>
            ${question(`1. 請用自己的話說出「${topicSafe}」的核心定義，並列出主要計算步驟。`, "依課本標準定義，寫出關鍵公式、性質或操作流程，步驟不少於三點。")}
            ${question(`2. 選擇一組標準數值，計算「${topicSafe}」的結果，並標示單位。`, "列出完整橫式，按步驟計算，最後檢查單位與約簡。")}
            <h3>B 中階進階題</h3>
            ${question(`3. 設計一道與「${topicSafe}」有關的生活情境題，並列式求解。`, "先列出已知及未知條件，再完成計算與驗算。")}
            ${question(`4. 已知結果，反求「${topicSafe}」的原始條件。`, "運用逆向思維、關係式或簡易方程求解，並說明每一步理由。")}
            ${question(`5. 指出一個與「${topicSafe}」有關的常見解題錯誤，並說明正確做法。`, "圈出錯誤步驟，補回遺漏條件或重新列式，寫出一句防錯提醒。")}
            <h3>C 高階思考題</h3>
            ${question(`6. 設計一題結合多個條件的「${topicSafe}」應用題，並嘗試使用兩種方法解答，比較優劣。`, "可使用圖解、轉化法、割補法或方程法；說明哪種方法更適合今天的課題。")}
          </section>`,
        mod5: `
          <section>
            <h2>五、課後鞏固反思筆記卡</h2>
            <div class="reflection-card">【${grade} 數學反思筆記：${topicSafe}】

1. 今日核心口訣：
________________________________________________

2. 我的易錯警示燈：
・${escapeHtml(hints[0])}
・______________________________________________

3. 我已掌握的解題步驟：
________________________________________________

4. 我想挑戰的延伸題：
________________________________________________</div>
          </section>`
      };
    }

    function getGeneratedPackage() {
      if (state.topic === "圓周與圓面積") {
        return getCircleModules(state.duration);
      }
      return buildUniversalPackage(state.grade, state.topic, state.duration);
    }

    function renderActiveView() {
      if (!state.generated) return;

      const moduleKeys = state.activeTab === "all"
        ? ["mod1", "mod2", "mod3", "mod4", "mod5"]
        : [state.activeTab];

      els.contentDisplay.innerHTML = moduleKeys
        .map((key) => state.generated[key] || "")
        .join('<div class="module-divider" aria-hidden="true"></div>');

      els.contentDisplay.classList.toggle("hide-answers", !state.showAnswers);
      updateSelectedButtons();
      if (window.lucide) lucide.createIcons();
    }

    function setLoading(isLoading) {
      els.loadingIndicator.classList.toggle("hidden", !isLoading);
      els.contentDisplay.classList.toggle("hidden", isLoading);
      els.generateButton.disabled = isLoading;
    }

    function generateResources({ showNotice = true } = {}) {
      const enteredTopic = els.customTopicInput.value.trim();
      state.topic = enteredTopic || els.topicDropdown.value || "數學綜合題";
      els.customTopicInput.value = state.topic;
      updateMeta();
      setLoading(true);

      window.setTimeout(() => {
        state.generated = getGeneratedPackage();
        setLoading(false);
        renderActiveView();
        if (showNotice) showToast(`已更新：${state.topic}（${state.duration} 分鐘）`);
      }, 180);
    }

    function showToast(message) {
      els.toastMsg.textContent = message;
      els.toast.classList.add("toast-show");
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => {
        els.toast.classList.remove("toast-show");
      }, 2600);
    }

    async function copyText(text, successMessage) {
      if (!text.trim()) {
        showToast("目前沒有可複製的內容。");
        return;
      }

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("Copy failed");
        }
        showToast(successMessage);
      } catch {
        showToast("複製失敗，請手動選取內容。");
      }
    }

    document.querySelectorAll(".grade-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.grade = button.dataset.grade;
        populateTopics(state.grade);
        updateSelectedButtons();
        generateResources();
      });
    });

    document.querySelectorAll(".dur-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.duration = Number(button.dataset.duration);
        updateSelectedButtons();
        generateResources();
      });
    });

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.activeTab = button.dataset.tab;
        renderActiveView();
      });
    });

    els.topicDropdown.addEventListener("change", () => {
      els.customTopicInput.value = els.topicDropdown.value;
    });

    els.customTopicInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        generateResources();
      }
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      generateResources();
    });

    document.getElementById("toggleAnswerSwitch").addEventListener("change", (event) => {
      state.showAnswers = event.target.checked;
      els.contentDisplay.classList.toggle("hide-answers", !state.showAnswers);
      showToast(state.showAnswers ? "已顯示解答與步驟。" : "已切換為學生空白工作紙。");
    });

    document.getElementById("printButton").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("copyAllButton").addEventListener("click", () => {
      copyText(els.contentDisplay.innerText, "已複製目前顯示的教學資源。");
    });

    els.contentDisplay.addEventListener("click", (event) => {
      const copyButton = event.target.closest("[data-copy-target]");
      if (!copyButton) return;
      const target = document.getElementById(copyButton.dataset.copyTarget);
      if (target) copyText(target.innerText, "已複製遊戲生成指令。");
    });

    window.addEventListener("DOMContentLoaded", () => {
      populateTopics(state.grade);
      updateSelectedButtons();
      updateMeta();
      generateResources({ showNotice: false });
      if (window.lucide) lucide.createIcons();
    });
  </script>
 </body>
</html>
