<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈老師的教學設計小工具 🌸</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax 3 垂直分數渲染 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #fce7f3 45%, #f3e8ff 100%);
            min-height: 100vh;
            color: #334155;
        }
        .cute-card {
            background: rgba(255, 255, 255, 0.96);
            border: 2px solid #fbcfe8;
            border-radius: 20px;
            box-shadow: 0 8px 25px -4px rgba(244, 114, 182, 0.12);
        }
        .step-indicator {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .step-active {
            background: linear-gradient(135deg, #ec4899, #d946ef);
            color: white;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            border-color: transparent;
        }
        .step-done {
            background: #fdf2f8;
            color: #db2777;
            border-color: #f472b6;
        }
        .step-locked {
            background: #f8fafc;
            color: #94a3b8;
            border-color: #e2e8f0;
        }
        .cute-btn-primary {
            background: linear-gradient(135deg, #ec4899 0%, #d946ef 100%);
            color: white;
            transition: all 0.2s ease;
        }
        .cute-btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(236, 72, 153, 0.3);
        }
        .cute-btn-secondary {
            background: #ffffff;
            color: #db2777;
            border: 1.5px solid #fbcfe8;
            transition: all 0.2s ease;
        }
        .cute-btn-secondary:hover {
            background: #fdf2f8;
            border-color: #f472b6;
        }
    </style>
</head>
<body class="p-3 md:p-6 pb-24">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- 頂部頁頭 -->
        <header class="cute-card p-5 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-pink-100 text-pink-600 flex items-center justify-center text-2xl shrink-0">🌸</div>
                <div>
                    <h1 class="text-xl font-black text-pink-700">沈老師的教學設計小工具</h1>
                    <p class="text-xs text-pink-500 mt-0.5">香港小學數學分步備課助手 · 規範垂直分數 $\frac{a}{b}$ 格式</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="px-3.5 py-1.5 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-circle-check text-emerald-500"></i>
                    <span>API Key 已內建就緒</span>
                </div>
            </div>
        </header>

        <!-- 步驟導航條 (Wizard Step Bar) -->
        <div class="cute-card p-3 md:p-4">
            <div class="grid grid-cols-5 gap-1 md:gap-2 text-center text-xs font-bold">
                <button onclick="jumpToStep(1)" id="stepTab1" class="step-indicator step-active p-2 rounded-xl flex flex-col items-center gap-1 border">
                    <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-[11px]">1</span>
                    <span class="hidden md:inline">設定課題</span>
                </button>
                <button onclick="jumpToStep(2)" id="stepTab2" class="step-indicator step-locked p-2 rounded-xl flex flex-col items-center gap-1 border" disabled>
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]" id="stepNum2">2</span>
                    <span class="hidden md:inline">重點難點</span>
                </button>
                <button onclick="jumpToStep(3)" id="stepTab3" class="step-indicator step-locked p-2 rounded-xl flex flex-col items-center gap-1 border" disabled>
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]" id="stepNum3">3</span>
                    <span class="hidden md:inline">教學計劃</span>
                </button>
                <button onclick="jumpToStep(4)" id="stepTab4" class="step-indicator step-locked p-2 rounded-xl flex flex-col items-center gap-1 border" disabled>
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]" id="stepNum4">4</span>
                    <span class="hidden md:inline">分層工作紙</span>
                </button>
                <button onclick="jumpToStep(5)" id="stepTab5" class="step-indicator step-locked p-2 rounded-xl flex flex-col items-center gap-1 border" disabled>
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]" id="stepNum5">5</span>
                    <span class="hidden md:inline">溫習筆記</span>
                </button>
            </div>
        </div>

        <!-- 步驟 1：年級與課題設定 -->
        <section id="stepSection1" class="cute-card p-5 md:p-6 space-y-4">
            <div class="flex items-center gap-3 border-b border-pink-100 pb-3">
                <span class="w-7 h-7 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs">1</span>
                <div>
                    <h2 class="text-base font-bold text-pink-800">步驟一：設定年級與數學課題</h2>
                    <p class="text-[11px] text-pink-500">輸入香港小學數學課程課題，為後續教材建立指引方向。</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-pink-800 mb-1.5">選擇年級</label>
                    <select id="gradeSelect" class="w-full p-2.5 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 bg-white text-xs font-medium">
                        <option value="小一 (Primary 1)">小一 (Primary 1)</option>
                        <option value="小二 (Primary 2)">小二 (Primary 2)</option>
                        <option value="小三 (Primary 3)" selected>小三 (Primary 3)</option>
                        <option value="小四 (Primary 4)">小四 (Primary 4)</option>
                        <option value="小五 (Primary 5)">小五 (Primary 5)</option>
                        <option value="小六 (Primary 6)">小六 (Primary 6)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-pink-800 mb-1.5">數學課題名稱</label>
                    <input type="text" id="topicInput" value="平行線" placeholder="例如：平行線、同分母分數加法、三角形面積" class="w-full p-2.5 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 bg-white text-xs font-medium">
                </div>
            </div>

            <div class="pt-2">
                <button onclick="startStep1()" id="btnStep1" class="cute-btn-primary w-full py-2.5 rounded-xl font-bold text-xs shadow-md">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> 確認課題，開始分析教材重點與學生難點
                </button>
            </div>
        </section>

        <!-- 步驟 2：教材分析與學生難點 -->
        <section id="stepSection2" class="cute-card p-5 md:p-6 space-y-4 hidden">
            <div class="flex items-center justify-between border-b border-pink-100 pb-3">
                <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs">2</span>
                    <h2 class="text-base font-bold text-pink-800">步驟二：教材重點、教學目標與學生迷思</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyText('resultStep2')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                    <button onclick="printBox('resultStep2', '教材重點與學生難點')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印</button>
                </div>
            </div>

            <div id="resultStep2" class="p-4 rounded-xl bg-white border border-pink-100 text-xs leading-relaxed space-y-2.5 min-h-[120px]"></div>

            <div class="p-3 bg-pink-50/80 rounded-xl border border-pink-200 flex flex-col md:flex-row justify-between items-center gap-3">
                <span class="text-xs text-pink-800 font-medium">確認分析符合校本需要後，即可進行教學流程設計：</span>
                <button onclick="goToStep3()" id="btnStep2Next" class="w-full md:w-auto px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow transition">
                    下一步：生成 40 分鐘詳細教案 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </section>

        <!-- 步驟 3：詳細教學計劃 (40分鐘教案) -->
        <section id="stepSection3" class="cute-card p-5 md:p-6 space-y-4 hidden">
            <div class="flex items-center justify-between border-b border-pink-100 pb-3">
                <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs">3</span>
                    <h2 class="text-base font-bold text-pink-800">步驟三：40 分鐘詳細教學計劃 (教案)</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyText('resultStep3')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                    <button onclick="printBox('resultStep3', '40分鐘詳細教學計劃')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印</button>
                </div>
            </div>

            <div id="resultStep3" class="p-4 rounded-xl bg-white border border-pink-100 text-xs leading-relaxed space-y-2.5 max-h-[380px] overflow-y-auto"></div>

            <div class="p-3 bg-purple-50 rounded-xl border border-purple-200 space-y-2">
                <label class="block text-xs font-bold text-purple-800">微調教案（可選）：</label>
                <div class="flex gap-2">
                    <input type="text" id="reviseLessonInput" placeholder="例如：加強直尺滑動操作步驟、加入小組討論任務..." class="flex-1 p-2 rounded-xl border border-purple-200 text-xs focus:outline-none bg-white">
                    <button onclick="reviseLesson()" id="btnRevise" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold hover:bg-purple-700 shrink-0">修訂教案</button>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="jumpToStep(2)" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50"><i class="fa-solid fa-arrow-left mr-1"></i> 上一步</button>
                <button onclick="goToStep4()" id="btnStep3Next" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow transition">
                    下一步：生成三層分層工作紙 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </section>

        <!-- 步驟 4：三層分層工作紙 -->
        <section id="stepSection4" class="cute-card p-5 md:p-6 space-y-4 hidden">
            <div class="flex items-center justify-between border-b border-pink-100 pb-3">
                <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs">4</span>
                    <div>
                        <h2 class="text-base font-bold text-pink-800">步驟四：三層分層工作紙設計</h2>
                        <p class="text-[11px] text-pink-500">包含【初階：基礎鞏固題】、【中階：進階應用題】與【高階：思維挑戰/自擬題】。</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyText('resultStep4')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                    <button onclick="printBox('resultStep4', '三層分層工作紙')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印工作紙</button>
                </div>
            </div>

            <div id="resultStep4" class="p-4 rounded-xl bg-white border border-pink-100 text-xs leading-relaxed space-y-2.5"></div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="jumpToStep(3)" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50"><i class="fa-solid fa-arrow-left mr-1"></i> 上一步</button>
                <button onclick="goToStep5()" id="btnStep4Next" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow transition">
                    下一步：生成延伸任務與溫習筆記 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </section>

        <!-- 步驟 5：延伸學習與溫習筆記 -->
        <section id="stepSection5" class="cute-card p-5 md:p-6 space-y-4 hidden">
            <div class="flex items-center justify-between border-b border-pink-100 pb-3">
                <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs">5</span>
                    <div>
                        <h2 class="text-base font-bold text-pink-800">步驟五：延伸任務與溫習筆記頁</h2>
                        <p class="text-[11px] text-pink-500">適合派發予學生進行課後自主學習、易錯點自查與家庭探究。</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyText('resultStep5')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                    <button onclick="printBox('resultStep5', '延伸任務與溫習筆記')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印筆記</button>
                </div>
            </div>

            <div id="resultStep5" class="p-4 rounded-xl bg-white border border-pink-100 text-xs leading-relaxed space-y-2.5"></div>

            <div class="flex justify-between items-center pt-3 border-t border-pink-100">
                <button onclick="jumpToStep(4)" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50"><i class="fa-solid fa-arrow-left mr-1"></i> 上一步</button>
                <button onclick="resetAll()" class="px-5 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-xl text-xs font-bold shadow transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 設計全新課題
                </button>
            </div>
        </section>

    </div>

    <script>
        // 內建您的專屬 API 金鑰
        const BUILTIN_KEY = "AQ.Ab8RN6JF0sj1i5vkoJYSsQIWjxCRHAuJKlv7sBidsEt87gJczQ";

        let analysisCache = "";
        let lessonPlanCache = "";
        let currentStep = 1;

        const SYSTEM_INSTRUCTION = `你是一位香港小學數學科資深教研專家。請嚴格遵循香港小學數學課程指引。
【數學符號規範】：
1. 所有分數必須使用 LaTeX 垂直上下分數語法 $\\frac{a}{b}$，絕對不可使用斜線 "/"。
2. 乘號使用 $\\times$，除號使用 $\\div$。
3. 語氣專業、貼近香港小學課堂實際教學語言。`;

        function getActiveKey() {
            return BUILTIN_KEY;
        }

        async function callGemini(promptText) {
            const activeKey = getActiveKey();

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(activeKey)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': activeKey
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            const txt = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!txt) throw new Error("API 回傳內容為空");
            return txt;
        }

        function formatMarkdown(text) {
            return text
                .replace(/(\d+)\s*\/\s*(\d+)/g, '$\\frac{$1}{$2}$')
                .replace(/^### (.*$)/gim, '<h3 class="font-bold text-pink-800 text-sm mt-3 mb-1">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="font-bold text-pink-900 text-base mt-4 mb-2 pb-1 border-b border-pink-100">$1</h2>')
                .replace(/^# (.*$)/gim, '<h1 class="font-bold text-pink-950 text-lg mt-4 mb-2">$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-pink-950 font-bold">$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(() => {});
            }
        }

        function updateStepTabs(activeStep) {
            for (let i = 1; i <= 5; i++) {
                const tab = document.getElementById(`stepTab${i}`);
                if (i === activeStep) {
                    tab.className = "step-indicator step-active p-2 rounded-xl flex flex-col items-center gap-1 border";
                } else if (i < activeStep) {
                    tab.className = "step-indicator step-done p-2 rounded-xl flex flex-col items-center gap-1 border";
                    tab.disabled = false;
                } else {
                    tab.className = "step-indicator step-locked p-2 rounded-xl flex flex-col items-center gap-1 border";
                }
            }
        }

        function jumpToStep(step) {
            for (let i = 1; i <= 5; i++) {
                const sec = document.getElementById(`stepSection${i}`);
                if (sec) sec.classList.add('hidden');
            }
            const target = document.getElementById(`stepSection${step}`);
            if (target) {
                target.classList.remove('hidden');
                target.scrollIntoView({ behavior: 'smooth' });
            }
            currentStep = step;
            updateStepTabs(step);
        }

        async function startStep1() {
            const grade = document.getElementById('gradeSelect').value;
            const topic = document.getElementById('topicInput').value.trim();
            const btn = document.getElementById('btnStep1');

            if (!topic) return alert('請先輸入課題名稱！');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在進行教材分析與難點梳理...';

            const prompt = `請以香港小學數學課程指引分析以下課題：
年級：${grade}
課題：${topic}

請依序條列輸出：
1. **教材重點與核心概念**
2. **具體教學目標 (涵蓋認知、技能與數學思維)**
3. **學生常見迷思概念與易錯點 (Misconceptions)**
所有分數必須使用垂直 LaTeX $\\frac{a}{b}$ 格式。`;

            try {
                const res = await callGemini(prompt);
                analysisCache = res;
                document.getElementById('resultStep2').innerHTML = formatMarkdown(res);
                renderMath();

                document.getElementById('stepTab2').disabled = false;
                jumpToStep(2);
            } catch (e) {
                alert('連線提示：' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> 確認課題，開始分析教材重點與學生難點';
            }
        }

        async function goToStep3() {
            const btn = document.getElementById('btnStep2Next');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在編寫 40 分鐘教案...';

            const grade = document.getElementById('gradeSelect').value;
            const topic = document.getElementById('topicInput').value.trim();

            const prompt = `基於以下分析：\n${analysisCache}\n
請為【${grade} - ${topic}】設計一份 40 分鐘的香港小學數學【詳細教學計劃】：
1. **引起動機 (5分鐘)**：生動情境提問引導
2. **發展階段 (25分鐘)**：包含教師引導、學生動手操作與概念歸納
3. **鞏固與總結 (10分鐘)**：課堂小結與口訣歸納
4. **板書設計要點與教具準備**
所有分數必須為 $\\frac{a}{b}$ 垂直格式。`;

            try {
                const res = await callGemini(prompt);
                lessonPlanCache = res;
                document.getElementById('resultStep3').innerHTML = formatMarkdown(res);
                renderMath();

                document.getElementById('stepTab3').disabled = false;
                jumpToStep(3);
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '下一步：生成 40 分鐘詳細教案 <i class="fa-solid fa-arrow-right ml-1"></i>';
            }
        }

        async function reviseLesson() {
            const reviseTxt = document.getElementById('reviseLessonInput').value.trim();
            if (!reviseTxt) return alert('請輸入修訂要求！');
            const btn = document.getElementById('btnRevise');

            btn.disabled = true;
            btn.innerText = '修訂中...';

            const prompt = `現有教案：\n${lessonPlanCache}\n\n請根據此修訂要求進行調整：【${reviseTxt}】\n重新輸出完整的 40 分鐘詳細教學計劃，所有分數維持垂直 $\\frac{a}{b}$ 格式。`;

            try {
                const res = await callGemini(prompt);
                lessonPlanCache = res;
                document.getElementById('resultStep3').innerHTML = formatMarkdown(res);
                document.getElementById('reviseLessonInput').value = '';
                renderMath();
                alert('教案修訂完成！');
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '修訂教案';
            }
        }

        async function goToStep4() {
            const btn = document.getElementById('btnStep3Next');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在生成分層工作紙...';

            const topic = document.getElementById('topicInput').value.trim();
            const prompt = `請為小學數學課題【${topic}】設計一份【三層分層工作紙】：
1. **【初階：基礎鞏固題】** (附具體提示或填空引導)
2. **【中階：進階應用題】** (生活情境文字題)
3. **【高階：思維挑戰題】** (開放探索或自擬題目)
所有分數必須使用垂直 LaTeX $\\frac{a}{b}$ 格式，運算符號使用 $\\times$ 和 $\\div$。`;

            try {
                const res = await callGemini(prompt);
                document.getElementById('resultStep4').innerHTML = formatMarkdown(res);
                renderMath();

                document.getElementById('stepTab4').disabled = false;
                jumpToStep(4);
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '下一步：生成三層分層工作紙 <i class="fa-solid fa-arrow-right ml-1"></i>';
            }
        }

        async function goToStep5() {
            const btn = document.getElementById('btnStep4Next');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 正在生成溫習筆記...';

            const topic = document.getElementById('topicInput').value.trim();
            const prompt = `請為課題【${topic}】設計【延伸學習與溫習筆記頁】：
1. **生活探究小任務** (讓學生在家動手探索的日常任務)
2. **溫習筆記整理** (核心規則、易錯辨析、重點提綱)
3. **親子數學互動題**
所有分數必須為垂直 $\\frac{a}{b}$ 格式。`;

            try {
                const res = await callGemini(prompt);
                document.getElementById('resultStep5').innerHTML = formatMarkdown(res);
                renderMath();

                document.getElementById('stepTab5').disabled = false;
                jumpToStep(5);
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '下一步：生成延伸任務與溫習筆記 <i class="fa-solid fa-arrow-right ml-1"></i>';
            }
        }

        function resetAll() {
            if (confirm("確定要重新設計全新課題嗎？")) {
                jumpToStep(1);
                for (let i = 2; i <= 5; i++) {
                    document.getElementById(`stepTab${i}`).disabled = true;
                }
            }
        }

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => alert('已成功複製到剪貼簿！'));
        }

        function printBox(id, title) {
            const win = window.open('', '_blank');
            win.document.write(`<html><head><title>${title}</title><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script><style>body{font-family:sans-serif;padding:24px;line-height:1.7;color:#1e293b;}h1,h2,h3{color:#be185d;}</style></head><body><h2>${title}</h2><hr><br>${document.getElementById(id).innerHTML}</body></html>`);
            win.document.close();
            setTimeout(() => win.print(), 800);
        }
    </script>
</body>
</html>
