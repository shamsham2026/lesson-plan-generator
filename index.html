<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈老師的教學設計小工具 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #fce7f3 50%, #f3e8ff 100%);
            min-height: 100vh;
            color: #334155;
        }
        .cute-card {
            background: rgba(255, 255, 255, 0.96);
            border: 2px solid #fbcfe8;
            border-radius: 20px;
            box-shadow: 0 8px 25px -4px rgba(244, 114, 182, 0.15);
        }
        .cute-btn-primary {
            background: linear-gradient(135deg, #ec4899 0%, #d946ef 100%);
            color: white;
            transition: all 0.2s ease;
        }
        .cute-btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
        }
        .cute-btn-secondary {
            background: #ffffff;
            color: #db2777;
            border: 1.5px solid #fbcfe8;
            transition: all 0.2s ease;
        }
        .cute-btn-secondary:hover {
            background: #fdf2f8;
            border-color: #f472b6;
        }
        .step-badge {
            background: linear-gradient(135deg, #f472b6, #a855f7);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
        }
    </style>
</head>
<body class="p-3 md:p-6 pb-20">

    <div class="max-w-3xl mx-auto space-y-6">

        <!-- 頂部標題與連線控制器 -->
        <header class="cute-card p-5 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-pink-100 text-pink-600 flex items-center justify-center text-2xl shrink-0">🌸</div>
                <div>
                    <h1 class="text-xl font-black text-pink-700">沈老師的教學設計小工具</h1>
                    <p class="text-xs text-pink-500 mt-0.5">香港小學數學科專用 · 規範垂直分數 $\frac{a}{b}$ · 三層分層工作紙</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleKeyModal()" class="px-3 py-2 bg-pink-50 border border-pink-200 text-pink-700 rounded-xl text-xs font-bold hover:bg-pink-100 flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-key text-pink-500"></i>
                    <span id="keyStatusLabel">連線設定</span>
                </button>
            </div>
        </header>

        <!-- 第一部分：課題輸入與教材分析 -->
        <section class="cute-card p-5 space-y-4">
            <div class="flex items-center gap-3 border-b border-pink-100 pb-3">
                <div class="step-badge">1</div>
                <h2 class="text-base font-bold text-pink-800">第一部分：年級課題與教材分析</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-pink-800 mb-1">選擇年級</label>
                    <select id="gradeSelect" class="w-full p-2.5 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 bg-white text-xs font-medium">
                        <option value="小一 (Primary 1)">小一 (Primary 1)</option>
                        <option value="小二 (Primary 2)">小二 (Primary 2)</option>
                        <option value="小三 (Primary 3)" selected>小三 (Primary 3)</option>
                        <option value="小四 (Primary 4)">小四 (Primary 4)</option>
                        <option value="小五 (Primary 5)">小五 (Primary 5)</option>
                        <option value="小六 (Primary 6)">小六 (Primary 6)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-pink-800 mb-1">數學課題名稱</label>
                    <input type="text" id="topicInput" value="同分母分數加法" placeholder="例如：平行線、乘法（一）" class="w-full p-2.5 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 bg-white text-xs font-medium">
                </div>
            </div>

            <button onclick="runPart1Analysis()" id="btnPart1" class="cute-btn-primary px-6 py-2.5 rounded-xl font-bold text-xs w-full shadow">
                <i class="fa-solid fa-magnifying-glass mr-1"></i> 開始分析教材重點、教學目標與學生難點
            </button>

            <div id="part1Container" class="hidden space-y-3 pt-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-pink-800"><i class="fa-solid fa-clipboard-check mr-1 text-pink-500"></i> 教材分析結果</h3>
                    <div class="flex gap-2">
                        <button onclick="copyContent('part1Result')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                        <button onclick="printContent('part1Result', '第一部分：教材分析')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印</button>
                    </div>
                </div>
                <div id="part1Result" class="p-4 rounded-xl bg-white border border-pink-200 text-xs leading-relaxed space-y-2"></div>
                <button onclick="unlockNext('part2Section')" class="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 shadow">
                    <i class="fa-solid fa-arrow-down mr-1"></i> 確認無誤，解鎖第二部分（詳細教學計劃）
                </button>
            </div>
        </section>

        <!-- 第二部分：詳細教學計劃 -->
        <section id="part2Section" class="cute-card p-5 space-y-4 opacity-50 pointer-events-none transition-all">
            <div class="flex items-center gap-3 border-b border-pink-100 pb-3">
                <div class="step-badge">2</div>
                <h2 class="text-base font-bold text-pink-800">第二部分：詳細教學計劃 (40分鐘教案)</h2>
            </div>

            <button onclick="generateLessonPlan()" id="btnPart2" class="cute-btn-primary px-6 py-2.5 rounded-xl font-bold text-xs w-full shadow">
                <i class="fa-solid fa-file-lines mr-1"></i> 生成詳細教學計劃 (引起動機、發展階段、板書設計)
            </button>

            <div id="part2Container" class="hidden space-y-3 pt-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-pink-800"><i class="fa-solid fa-book-open mr-1 text-pink-500"></i> 詳細教案內容</h3>
                    <div class="flex gap-2">
                        <button onclick="copyContent('part2Result')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                        <button onclick="printContent('part2Result', '第二部分：教學計劃')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印</button>
                    </div>
                </div>
                <div id="part2Result" class="p-4 rounded-xl bg-white border border-pink-200 text-xs leading-relaxed space-y-2 max-h-96 overflow-y-auto"></div>

                <div class="p-3 bg-purple-50 rounded-xl border border-purple-200 space-y-2">
                    <label class="block text-xs font-bold text-purple-800">輸入修訂意見（與 AI 共同編修教案）：</label>
                    <div class="flex gap-2">
                        <input type="text" id="part2ReviseInput" placeholder="例如：增加動手操作環節、強化口訣..." class="flex-1 p-2 rounded-xl border border-purple-300 text-xs focus:outline-none bg-white">
                        <button onclick="reviseLessonPlan()" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold hover:bg-purple-700 shrink-0">修訂教案</button>
                    </div>
                </div>

                <button onclick="unlockNext('part3Section'); unlockNext('part4Section');" class="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 shadow">
                    <i class="fa-solid fa-arrow-down mr-1"></i> 確定教學計劃，解鎖分層工作紙與延伸筆記
                </button>
            </div>
        </section>

        <!-- 第三部分：三層分層工作紙 -->
        <section id="part3Section" class="cute-card p-5 space-y-4 opacity-50 pointer-events-none transition-all">
            <div class="flex items-center gap-3 border-b border-pink-100 pb-3">
                <div class="step-badge">3</div>
                <h2 class="text-base font-bold text-pink-800">第三部分：三層分層工作紙設計</h2>
            </div>
            <p class="text-xs text-pink-700">包含【初階：基礎鞏固題】、【中階：進階應用題】及【高階：思維挑戰/自擬題】。</p>

            <button onclick="generateWorksheet()" id="btnPart3" class="cute-btn-primary px-6 py-2.5 rounded-xl font-bold text-xs w-full shadow">
                <i class="fa-solid fa-layer-group mr-1"></i> 生成分層工作紙 (垂直分數 $\frac{a}{b}$ 格式)
            </button>

            <div id="part3Container" class="hidden space-y-3 pt-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-pink-800"><i class="fa-solid fa-file-pen mr-1 text-pink-500"></i> 分層工作紙內容</h3>
                    <div class="flex gap-2">
                        <button onclick="copyContent('part3Result')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                        <button onclick="printContent('part3Result', '第三部分：分層工作紙')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印工作紙</button>
                    </div>
                </div>
                <div id="part3Result" class="p-4 rounded-xl bg-white border border-pink-200 text-xs leading-relaxed space-y-2"></div>
            </div>
        </section>

        <!-- 第四部分：延伸學習與溫習筆記 -->
        <section id="part4Section" class="cute-card p-5 space-y-4 opacity-50 pointer-events-none transition-all">
            <div class="flex items-center gap-3 border-b border-pink-100 pb-3">
                <div class="step-badge">4</div>
                <h2 class="text-base font-bold text-pink-800">第四部分：延伸學習活動與溫習筆記頁</h2>
            </div>

            <button onclick="generateExtension()" id="btnPart4" class="cute-btn-primary px-6 py-2.5 rounded-xl font-bold text-xs w-full shadow">
                <i class="fa-solid fa-house-laptop mr-1"></i> 生成回家自主學習任務與溫習筆記頁
            </button>

            <div id="part4Container" class="hidden space-y-3 pt-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-pink-800"><i class="fa-solid fa-book-bookmark mr-1 text-pink-500"></i> 延伸學習與溫習筆記</h3>
                    <div class="flex gap-2">
                        <button onclick="copyContent('part4Result')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-regular fa-copy"></i> 複製</button>
                        <button onclick="printContent('part4Result', '第四部分：延伸筆記')" class="cute-btn-secondary px-2.5 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-print"></i> 列印筆記頁</button>
                    </div>
                </div>
                <div id="part4Result" class="p-4 rounded-xl bg-white border border-pink-200 text-xs leading-relaxed space-y-2"></div>
            </div>
        </section>

    </div>

    <!-- 金鑰設定彈窗 -->
    <div id="keyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="cute-card bg-white p-5 max-w-sm w-full space-y-3 border-2 border-pink-300 shadow-2xl">
            <div class="flex justify-between items-center border-b border-pink-100 pb-2">
                <h3 class="text-xs font-bold text-pink-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-pink-500"></i> API 金鑰設定
                </h3>
                <button onclick="toggleKeyModal()" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>
            <p class="text-[11px] text-slate-500">請輸入 Google AI Studio 取得之 API Key：</p>
            <input type="password" id="customApiKeyInput" placeholder="貼上 API 金鑰..." class="w-full p-2 rounded-xl border border-pink-200 text-xs focus:outline-none bg-pink-50/50">
            <div id="testResultMsg" class="text-xs p-2 rounded-lg hidden"></div>
            <div class="flex gap-2">
                <button onclick="testKeyConnection()" id="btnTestKey" class="flex-1 py-1.5 bg-pink-100 text-pink-700 rounded-xl text-xs font-bold hover:bg-pink-200">🔍 測試</button>
                <button onclick="saveCustomKey()" class="flex-1 py-1.5 bg-pink-600 text-white rounded-xl text-xs font-bold hover:bg-pink-700">💾 儲存</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "";
        let part1Data = "";
        let lessonPlanData = "";

        const SYSTEM_INSTRUCTION = `你是一位香港小學數學科資深教研專家。請嚴格遵循香港小學數學課程指引。
【數學符號規範】：
1. 所有分數必須使用 LaTeX 垂直上下分數語法 $\\frac{a}{b}$，絕對不可使用斜線 "/"。
2. 乘號使用 $\\times$，除號使用 $\\div$。`;

        function getEffectiveKey() {
            const hash = window.location.hash;
            if (hash && hash.includes('key=')) {
                const urlKey = hash.split('key=')[1]?.split('&')[0]?.trim();
                if (urlKey) return decodeURIComponent(urlKey);
            }
            const stored = localStorage.getItem('user_gemini_key');
            if (stored && stored.trim()) return stored.trim();
            return apiKey;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (getEffectiveKey()) {
                document.getElementById('keyStatusLabel').innerText = 'API Key 已就緒 ✅';
            }
        });

        function toggleKeyModal() {
            document.getElementById('keyModal').classList.toggle('hidden');
            document.getElementById('customApiKeyInput').value = localStorage.getItem('user_gemini_key') || "";
            document.getElementById('testResultMsg').classList.add('hidden');
        }

        function saveCustomKey() {
            const val = document.getElementById('customApiKeyInput').value.trim();
            if (val) {
                localStorage.setItem('user_gemini_key', val);
                document.getElementById('keyStatusLabel').innerText = 'API Key 已就緒 ✅';
                alert('API Key 儲存成功！');
            } else {
                localStorage.removeItem('user_gemini_key');
                document.getElementById('keyStatusLabel').innerText = '連線設定';
            }
            toggleKeyModal();
        }

        async function testKeyConnection() {
            const key = document.getElementById('customApiKeyInput').value.trim() || getEffectiveKey();
            const msg = document.getElementById('testResultMsg');
            const btn = document.getElementById('btnTestKey');
            if (!key) {
                msg.className = 'text-xs p-2 rounded-lg bg-rose-50 text-rose-700 block';
                msg.innerText = '請先填入 API Key！';
                return;
            }
            btn.disabled = true;
            btn.innerText = '測試中...';
            msg.className = 'text-xs p-2 rounded-lg bg-slate-100 text-slate-700 block';
            msg.innerText = '正在測試連線...';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${response.status}`);
                }
                msg.className = 'text-xs p-2 rounded-lg bg-emerald-50 text-emerald-700 block';
                msg.innerText = '連線成功！金鑰運作正常。';
            } catch (e) {
                msg.className = 'text-xs p-2 rounded-lg bg-rose-50 text-rose-700 block';
                msg.innerText = `連線失敗：${e.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = '🔍 測試';
            }
        }

        async function callGeminiApi(promptText) {
            const activeKey = getEffectiveKey();
            if (!activeKey) {
                toggleKeyModal();
                throw new Error("請先點擊上方「連線設定」填入 API Key！");
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(activeKey)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': activeKey
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error("API 回傳內容為空");
            return text;
        }

        function formatMarkdown(text) {
            return text
                .replace(/(\d+)\s*\/\s*(\d+)/g, '$\\frac{$1}{$2}$')
                .replace(/^### (.*$)/gim, '<h3 class="font-bold text-pink-800 text-sm mt-3 mb-1">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="font-bold text-pink-900 text-base mt-4 mb-2 pb-1 border-b border-pink-100">$1</h2>')
                .replace(/^# (.*$)/gim, '<h1 class="font-bold text-pink-950 text-lg mt-4 mb-2">$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-pink-950 font-bold">$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(() => {});
            }
        }

        function unlockNext(sectionId) {
            const sec = document.getElementById(sectionId);
            sec.classList.remove('opacity-50', 'pointer-events-none');
            sec.scrollIntoView({ behavior: 'smooth' });
        }

        async function runPart1Analysis() {
            const grade = document.getElementById('gradeSelect').value;
            const topic = document.getElementById('topicInput').value.trim();
            const btn = document.getElementById('btnPart1');
            if (!topic) return alert('請輸入課題名稱！');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 分析中...';

            const prompt = `請分析香港小學數學課題：
年級：${grade}
課題：${topic}

請具體列出：
1. **教材內容重點與核心概念**
2. **具體教學目標 (知識、技能、態度)**
3. **學生常見學習難點與迷思概念 (Misconceptions)**
所有分數必須使用垂直 LaTeX $\\frac{a}{b}$ 格式。`;

            try {
                const res = await callGeminiApi(prompt);
                part1Data = res;
                document.getElementById('part1Result').innerHTML = formatMarkdown(res);
                document.getElementById('part1Container').classList.remove('hidden');
                renderMath();
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass mr-1"></i> 開始分析教材重點、教學目標與學生難點';
            }
        }

        async function generateLessonPlan() {
            const btn = document.getElementById('btnPart2');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 編寫教案中...';

            const prompt = `基於以下分析：\n${part1Data}\n\n請設計一份 40 分鐘的香港小學數學【詳細教學計劃】：
1. **引起動機 (5分鐘)**
2. **發展階段 (25分鐘)** (含學生操作與探究)
3. **鞏固與總結 (10分鐘)**
4. **板書設計要點**
所有分數必須為 $\\frac{a}{b}$ 格式。`;

            try {
                const res = await callGeminiApi(prompt);
                lessonPlanData = res;
                document.getElementById('part2Result').innerHTML = formatMarkdown(res);
                document.getElementById('part2Container').classList.remove('hidden');
                renderMath();
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-file-lines mr-1"></i> 生成詳細教學計劃 (教案)';
            }
        }

        async function reviseLessonPlan() {
            const reviseText = document.getElementById('part2ReviseInput').value.trim();
            if (!reviseText) return alert('請輸入修訂意見！');

            const prompt = `現有教案：\n${lessonPlanData}\n\n修訂要求：【${reviseText}】\n請輸出修改後的完整詳細教學計劃。所有分數為 $\\frac{a}{b}$ 格式。`;
            try {
                const res = await callGeminiApi(prompt);
                lessonPlanData = res;
                document.getElementById('part2Result').innerHTML = formatMarkdown(res);
                document.getElementById('part2ReviseInput').value = '';
                renderMath();
                alert('教案已修訂！');
            } catch (e) {
                alert(e.message);
            }
        }

        async function generateWorksheet() {
            const topic = document.getElementById('topicInput').value;
            const btn = document.getElementById('btnPart3');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 生成工作紙中...';

            const prompt = `請為小學數學課題【${topic}】設計一份【三層分層工作紙】：
1. **【初階：基礎鞏固題】** (附提示)
2. **【中階：進階應用題】** (生活情境文字題)
3. **【高階：思維挑戰與自擬題】** (開放探索題)
所有分數必須使用垂直 LaTeX $\\frac{a}{b}$ 格式，運算符號使用 $\\times$ 和 $\\div$。`;

            try {
                const res = await callGeminiApi(prompt);
                document.getElementById('part3Result').innerHTML = formatMarkdown(res);
                document.getElementById('part3Container').classList.remove('hidden');
                renderMath();
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-layer-group mr-1"></i> 生成分層工作紙 (垂直分數格式)';
            }
        }

        async function generateExtension() {
            const topic = document.getElementById('topicInput').value;
            const btn = document.getElementById('btnPart4');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 生成延伸筆記中...';

            const prompt = `請為課題【${topic}】設計【延伸學習與溫習筆記頁】：
1. **生活數學探究小任務** (自主探索活動)
2. **溫習筆記整理** (重點公式、易錯提醒)
3. **親子數學互動小挑戰**
所有分數必須為 $\\frac{a}{b}$ 格式。`;

            try {
                const res = await callGeminiApi(prompt);
                document.getElementById('part4Result').innerHTML = formatMarkdown(res);
                document.getElementById('part4Container').classList.remove('hidden');
                renderMath();
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-house-laptop mr-1"></i> 生成回家自主學習任務與溫習筆記頁';
            }
        }

        function copyContent(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => alert('已複製內容！'));
        }

        function printContent(id, title) {
            const win = window.open('', '_blank');
            win.document.write(`<html><head><title>${title}</title><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script><style>body{font-family:sans-serif;padding:20px;line-height:1.7;color:#1e293b;}h1,h2,h3{color:#be185d;}</style></head><body><h2>${title}</h2><hr><br>${document.getElementById(id).innerHTML}</body></html>`);
            win.document.close();
            setTimeout(() => win.print(), 800);
        }
    </script>
</body>
</html>
